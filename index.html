<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snap | Make remote work</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="overlay"></div>

  <header class="header">
    <a href="/" class="logo-link">
      <img src="./assets/images/logo.svg" alt="snap's logo" class="logo" />
    </a>

    <button class="menu-btn" type="button" aria-label="Open menu">
      <img src="./assets/images/icon-menu.svg" alt="" class="open-menu" />
    </button>

    <nav class="primary-nav">
      <button class="menu-btn nav-close-btn" type="button" aria-label="Close menu">
        <img src="./assets/images/icon-close-menu.svg" alt="" class="close-menu" />
      </button>

      <ul class="nav-list">
        <li class="nav-link">
          <button class="dropdown-toggle" type="button" aria-expanded="false">
            <span>Features</span>
            <img src="./assets/images/icon-arrow-down.svg" alt="" class="arrow-icon" />
          </button>
          <ul class="dropdown-list">
            <li class="dropdown-link">
              <a href="#" aria-label="todo-list">
                <img src="./assets/images/icon-todo.svg" alt="" />
                Todo List
              </a>
            </li>
            <li class="dropdown-link">
              <a href="#">
                <img src="./assets/images/icon-calendar.svg" alt="" />
                Calendar
              </a>
            </li>
            <li class="dropdown-link">
              <a href="#">
                <img src="./assets/images/icon-reminders.svg" alt="" />
                Reminders
              </a>
            </li>
            <li class="dropdown-link">
              <a href="#">
                <img src="./assets/images/icon-planning.svg" alt="" />
                Planning
              </a>
            </li>
          </ul>
        </li>

        <li class="nav-link">
          <button class="dropdown-toggle" type="button" aria-expanded="false">
            <span>Company</span>
            <img src="./assets/images/icon-arrow-down.svg" alt="" class="arrow-icon" />
          </button>
          <ul class="dropdown-list">
            <li class="dropdown-link"><a href="#">History</a></li>
            <li class="dropdown-link"><a href="#">Our Team</a></li>
            <li class="dropdown-link"><a href="#">Blog</a></li>
          </ul>
        </li>

        <li class="nav-link plain"><a href="#">Careers</a></li>
        <li class="nav-link plain"><a href="#">About</a></li>
      </ul>

      <div class="registration">
        <button class="btn-login" type="button">Login</button>
        <button class="btn-register" type="button">Register</button>
      </div>
    </nav>
  </header>

  <main>
    <div class="hero">
      <picture>
        <source media="(min-width: 768px)" srcset="./assets/images/image-hero-desktop.png" />
        <img src="./assets/images/image-hero-mobile.png" alt="Illustration of a person organizing tasks on a large screen" />
      </picture>

      <div class="text-content">
        <h1>Make remote work</h1>
        <p>Get your team in sync, no matter your location. Streamline processes, create team rituals, and watch productivity soar.</p>
        <div class="cta">
          <button class="btn-learn-more" type="button">Learn more</button>
          <button class="btn-register-hero" type="button">Register</button>
        </div>
      </div>
    </div>

    <div class="clients">
      <img src="./assets/images/client-databiz.svg" alt="Databiz" />
      <img src="./assets/images/client-audiophile.svg" alt="Audiophile" />
      <img src="./assets/images/client-meet.svg" alt="Meet" />
      <img src="./assets/images/client-maker.svg" alt="Maker" />
    </div>
  </main>

  <footer class="attribution">
    <p>Challenge by <a href="https://crio.do" target="_blank">Crio.Do</a>. Coded by Akshat.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
